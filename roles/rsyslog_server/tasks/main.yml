---
- name: Ensure rsyslog is installed (server)
  ansible.builtin.package:
    name: rsyslog
    state: present

- name: Create base directory for remote logs
  ansible.builtin.file:
    path: /var/log/remote
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Deploy rsyslog server configuration
  ansible.builtin.template:
    src: server.conf.j2
    dest: /etc/rsyslog.d/10-remote-server.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart rsyslog

- name: Open firewall ports for rsyslog (UDP/TCP 514) if firewalld is running
  ansible.builtin.shell: |
    if systemctl is-active firewalld >/dev/null 2>&1; then
      firewall-cmd --add-port=514/tcp --permanent
      firewall-cmd --add-port=514/udp --permanent
      firewall-cmd --reload
    fi
  args:
    warn: false
  changed_when: false # we keep it simple in lab; can refine later

- name: Ensure rsyslog is enabled and running (server)
  ansible.builtin.service:
    name: rsyslog
    state: restarted
    enabled: true
